[package]
name = "pmll-anchor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PMLL 32-byte memory commitment surface on Stellar (Soroban)."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
