# PMLL stellar.toml — SEP-1 style network + contract metadata
# Contract: pmll-anchor (Soroban, target wasm32v1-none, soroban-sdk 27.x)
# Build: cd pmll-anchor && stellar contract build
#        → target/wasm32v1-none/release/pmll_anchor.wasm

NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
NETWORK = "TESTNET"

PROJECT_REPO = "https://github.com/drQedwards/pmll"

[contracts]
# Replace with the live Contract ID after deploy + init + verified store.
# Current value is the recorded testnet ID if already deployed; verify on explorer before relying on it.
pmll_anchor = "CBGJW7XCRL2V7UGJXPC5FDYY5TLXDC4TNJVXGYUVICP32PJA6ECGHBNP"

[notes]
# Build target MUST be wasm32v1-none (Rust 1.84+). Never wasm32-unknown-unknown on 1.82+.
# After deploy: set pmll_anchor, record tx hash in SKILL.md, then agents may treat the surface as live.
