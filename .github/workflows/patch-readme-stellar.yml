name: patch-readme-stellar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-readme-stellar.yml"
      - ".github/scripts/patch-readme-stellar.py"

permissions:
  contents: write

concurrency:
  group: patch-readme-stellar
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add live Stellar IDs to README
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-readme-stellar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-readme-stellar.yml
          git rm -f .github/scripts/patch-readme-stellar.py
          git add README.md
          git commit -m "Document live pmll-anchor IDs in README"
          git push origin HEAD:main
